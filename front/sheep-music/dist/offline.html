<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 - Sheep Music</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #14162b;
      color: #e8e9f3;
    }
    .offline-box { text-align: center; padding: 24px; }
    .offline-box .icon { font-size: 64px; }
    .offline-box h1 { font-size: 22px; margin: 16px 0 8px; }
    .offline-box p { color: #9aa0c3; margin: 0 0 24px; }
    .offline-box button {
      padding: 10px 28px;
      border: none;
      border-radius: 20px;
      background: #6c5ce7;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .offline-box button:hover { background: #5a4bd1; }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="icon">🎵</div>
    <h1>网络连接不可用</h1>
    <p>当前处于离线状态，请检查网络后重试</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
