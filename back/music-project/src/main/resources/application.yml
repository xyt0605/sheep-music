# 应用服务 WEB 访问端口
server:
  port: ${PORT:9000}

spring:
  application:
    name: Sheep-music
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sheepmusic?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}  # 表结构策略：开发 update；生产可设 validate（配 init.sql）
    show-sql: false     # 生产不打印 SQL，开发调试时可临时改回 true
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect  # Hibernate 6 统一方言，自动探测 MySQL 版本
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true  # 启用文件上传
      max-file-size: 30MB  # 单个文件最大大小
      max-request-size: 30MB  # 整个请求最大大小

  # Spring AI（OpenAI 兼容协议：默认指向智谱 GLM 开放平台，可换 DeepSeek 等任意兼容端点）
  # 密钥未配置时使用占位符——应用正常启动，仅 agent 实际调用时才需要真实密钥
  ai:
    openai:
      api-key: ${AGENT_API_KEY:not-configured}
      base-url: ${AGENT_API_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      chat:
        options:
          model: ${AGENT_MODEL:glm-4.5-flash}
          temperature: 0.7

# JWT配置
jwt:
  secret: ${JWT_SECRET:sheep-music-secret-key-2025}
  expiration: 604800000  # 7天有效期（毫秒）

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}
    bucketName: ${ALIYUN_OSS_BUCKET_NAME:sheepmusic}
    urlPrefix: ${ALIYUN_OSS_URL_PREFIX:https://sheepmusic.oss-cn-hangzhou.aliyuncs.com/}

# 接口文档（knife4j 4.x / springdoc）
knife4j:
  enable: true
springdoc:
  api-docs:
    path: /v3/api-docs
